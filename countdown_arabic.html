
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: transparent;
  font-family: 'Cairo', sans-serif;
  color: #000000;
}

.countdown {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  direction: rtl;
  width: 100%;
  text-align: center;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 65px;
}

.number {
  font-size: clamp(28px, 6vw, 55px);
  font-weight: 600;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}

.label {
  font-size: clamp(12px, 2.5vw, 17px);
  font-weight: 400;
  opacity: 0.85;
  margin-top: 5px;
}

.separator {
  font-size: 35px;
  opacity: 0.6;
  margin-top: -15px;
}

@media (max-width: 400px) {
  .countdown {
    gap: 7px;
  }

  .unit {
    min-width: 55px;
  }

  .separator {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="countdown">
  <div class="unit">
    <div class="number" id="days">٠٠</div>
    <div class="label">يوم</div>
  </div>

  <div class="separator">:</div>

  <div class="unit">
    <div class="number" id="hours">٠٠</div>
    <div class="label">ساعة</div>
  </div>

  <div class="separator">:</div>

  <div class="unit">
    <div class="number" id="minutes">٠٠</div>
    <div class="label">دقيقة</div>
  </div>

  <div class="separator">:</div>

  <div class="unit">
    <div class="number" id="seconds">٠٠</div>
    <div class="label">ثانية</div>
  </div>
</div>

<script>
// وقت الهدف: 18:00 مساءً بتوقيت القاهرة
const targetDate = new Date("2026-10-16T18:00:00+02:00").getTime();

// تحويل الأرقام إلى أرقام عربية
const arabicNumbers = new Intl.NumberFormat('ar-EG', {
  useGrouping: false,
  minimumIntegerDigits: 2
});

function updateCountdown() {
  const now = Date.now();
  const distance = targetDate - now;

  if (distance <= 0) {
    document.getElementById("days").textContent = "٠٠";
    document.getElementById("hours").textContent = "٠٠";
    document.getElementById("minutes").textContent = "٠٠";
    document.getElementById("seconds").textContent = "٠٠";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("days").textContent = arabicNumbers.format(days);
  document.getElementById("hours").textContent = arabicNumbers.format(hours);
  document.getElementById("minutes").textContent = arabicNumbers.format(minutes);
  document.getElementById("seconds").textContent = arabicNumbers.format(seconds);
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
